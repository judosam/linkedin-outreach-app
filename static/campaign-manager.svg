<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <!-- Background Multi-Stop Gradient -->
    <linearGradient id="cmBg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- Top Glow / Lighting -->
    <radialGradient id="cmTopGlow" cx="35%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>

    <!-- Precision Glass Border -->
    <linearGradient id="cmGlassBorder" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#BFDBFE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Velocity Beam Gradient -->
    <linearGradient id="cmBeam" x1="10" y1="28" x2="30" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Secondary Wave Gradient -->
    <linearGradient id="cmAccent" x1="12" y1="12" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>

    <!-- Soft Depth Filter -->
    <filter id="cmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0B0E15" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base with Ambient Glow -->
  <rect width="40" height="40" rx="11" fill="url(#cmBg)"/>
  <rect width="40" height="40" rx="11" fill="url(#cmTopGlow)"/>
  <rect x="0.5" y="0.5" width="39" height="39" rx="10.5" stroke="url(#cmGlassBorder)" stroke-width="1"/>

  <!-- Network Secondary Route -->
  <path d="M12 28 C12 21 16 23 20 20 C24 17 28 19 28 12" stroke="url(#cmAccent)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Primary Outreach Velocity Arc -->
  <path d="M12 28 C12 16 22 13 28 12" stroke="url(#cmBeam)" stroke-width="3.2" stroke-linecap="round" filter="url(#cmShadow)"/>

  <!-- High-Velocity Chevron Arrowhead -->
  <path d="M22 11 L28 12 L27 18" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Origin Account Node -->
  <circle cx="12" cy="28" r="3.2" fill="#38BDF8"/>
  <circle cx="12" cy="28" r="1.3" fill="#FFFFFF"/>

  <!-- Core Relay Hub Node -->
  <circle cx="20" cy="20" r="2.2" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Target Lead Destination Node -->
  <circle cx="28" cy="12" r="3.5" fill="#60A5FA"/>
  <circle cx="28" cy="12" r="1.4" fill="#FFFFFF"/>
</svg>
